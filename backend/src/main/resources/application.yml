spring:
  application:
    name: starter
  datasource:
    # 로컬 기본값은 저장소 루트의 compose.yaml 이 띄우는 MySQL 이다. 다른 DB 는 환경 변수로 준다.
    url: ${DB_URL:jdbc:mysql://localhost:3306/starter}
    username: ${DB_USERNAME:starter}
    password: ${DB_PASSWORD:starter}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 마이그레이션이 만든다. Hibernate 는 엔티티와 맞는지만 검사한다.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
