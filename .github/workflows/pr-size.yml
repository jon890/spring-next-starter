name: PR size

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-size:
    name: pr-size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      large: ${{ steps.size.outputs.large }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: 운영 코드 변경 줄 검사
        id: size
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/pr/pr-size.ts "$PR_BASE" "$PR_HEAD"

  size-label:
    # 쓰기 토큰을 가진 job 은 PR 코드를 체크아웃하거나 실행하지 않는다.
    # 포크 PR 은 크기를 검사하되 읽기 전용 토큰이라 라벨을 바꾸지 않는다.
    if: always() && needs.pr-size.outputs.large != '' && github.event.pull_request.head.repo.full_name == github.repository
    needs: pr-size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LARGE: ${{ needs.pr-size.outputs.large }}
        with:
          script: |
            const params = { ...context.repo, issue_number: context.issue.number };
            const label = 'size:large';
            const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, { ...params, per_page: 100 });
            const present = labels.some(item => item.name === label);
            if (process.env.LARGE === 'true' && !present) {
              try {
                await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'd93f0b', description: 'Production code change is large' });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
              await github.rest.issues.addLabels({ ...params, labels: [label] });
            } else if (process.env.LARGE === 'false' && present) {
              await github.rest.issues.removeLabel({ ...params, name: label });
            }
