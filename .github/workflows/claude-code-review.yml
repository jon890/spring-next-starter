name: Claude code review

# Ready 로 올린 PR 을 Claude 가 한 번 리뷰한다. 선택 기능이다.
# repository secret ANTHROPIC_API_KEY 나 CLAUDE_CODE_OAUTH_TOKEN 중 하나가 있어야 돈다. 없으면 리뷰 job 을 건너뛴다.
# 리뷰 한 번마다 API 사용량이 과금된다. 준비 방법과 비용은 README 의 「Claude code review」 절을 본다.
# pull_request_target 으로 바꾸지 않는다. 그러면 포크 PR 의 코드가 secret 을 받은 채 실행된다.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secret-check:
    name: claude-review-enabled
    # Draft 와 포크 PR 은 리뷰하지 않는다. 포크 PR 은 secret 을 받지 못한다.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_API_KEY" = true ] || [ "$HAS_OAUTH_TOKEN" = true ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY 와 CLAUDE_CODE_OAUTH_TOKEN 이 없어 Claude 리뷰를 건너뛴다." >> "$GITHUB_STEP_SUMMARY"
          fi

  claude-review:
    name: claude-review
    needs: secret-check
    if: needs.secret-check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: anthropics/claude-code-action@18bb01f132748aac392d2992354fa598d28ada76 # v1.0.266
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR 을 리뷰한다. 먼저 AGENTS.md 와 바뀐 경로의 AGENTS.md, docs/code-rules/INDEX.md 를 읽는다.
            바뀐 파일만 본다. 정확성, 실패 처리, 보안(비밀값·개인 정보 포함), 테스트의 빈틈, 코드 규칙 위반, 문서와 코드의 불일치를 찾는다.
            지적마다 P1(머지 전 반드시 고침)부터 P5(취향)까지 등급을 붙이고, 무엇이 어떤 입력에서 어떻게 잘못되는지 적는다.
            구체적인 줄은 inline comment 로, 전체 요약은 PR 댓글 하나로 남긴다. 지적이 없으면 없다고 적는다.
            리뷰는 한국어로 쓴다. 파일을 고치지 않는다.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
