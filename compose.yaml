# 로컬 개발용 MySQL 이다. backend 의 application.yml 기본값과 맞춘다.
# 계정과 비밀번호는 로컬 전용 예시 값이다. 운영 환경에서는 DB_URL, DB_USERNAME, DB_PASSWORD 환경 변수로 준다.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: starter
      MYSQL_USER: starter
      MYSQL_PASSWORD: starter
      MYSQL_ROOT_PASSWORD: starter-root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP 로 확인한다. 첫 기동의 초기화 단계는 소켓으로만 답하는 임시 서버라, 소켓으로 보면 접속을 받기 전에 healthy 가 된다.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ustarter", "-pstarter"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
